<style>body{background:#101522;color:#eee;font:16px system-ui;margin:0;padding:16px}button{display:block;width:100%;margin:8px 0;padding:16px;font-size:18px;border-radius:12px;border:0;background:#26304d;color:#fff;text-align:left}button small{color:#9ab;display:block;font-size:13px}h2{margin:18px 0 4px}h3{margin:0;color:#9ab;font-weight:400;font-size:14px}.r{background:#2a4a35}</style>
<h1 style="margin:0 0 6px">Card-play sounds, round 2</h1><p>Tap to hear. Green ones are my recommendations. Tell me a letter and number for each type.</p><div id=l></div>
<script>
var G=[["Attack (plays when you play the card, before the hit lands)",[["a1","Swoosh A","Quick fast air swish",1],["a2","Swoosh B","Slightly lower swish"],["a3","Swoosh C","Short and snappy"],["a4","Long swing","Big weighty arm swing"],["a5","Swing, airy","Looser swing with tail"],["a6","Blade slash A","Clean sword cut",1],["a7","Blade slash B","Short sharp slash"],["a8","Blade slash C","Slash with a ring"],["a9","Light punch","Dry punch thump"],["a10","Impact","Plain solid hit"]]],
["Charge (energy building)",[["c1","Charge A","Short rising energy",1],["c2","Charge B","Rise with a bright top"],["c3","Charge C","Warm swell"],["c4","Power-up","Soft glow-up"],["c5","Fire burst A","Flame whoosh igniting",1],["c6","Fire burst B","Bigger flame roar"],["c7","Fire","Crackling flare"]]],
["Heal (a fourth card type, in case you want to pick)",[["h1","Chime A","Gentle bell shimmer",1],["h2","Chime B","Brighter sparkle"],["h3","Chime C","Warm and airy"],["h4","Current heal","What you hear now"]]]];
var l=document.getElementById('l');G.forEach(function(g,gi){var h=document.createElement('h2');h.textContent=g[0];l.appendChild(h);g[1].forEach(function(n,i){var b=document.createElement('button');if(n[3])b.className='r';b.innerHTML=n[0].toUpperCase().replace(/^([A-Z])/,'$1')+' · '+n[1]+'<small>'+n[2]+(n[3]?' · recommended':'')+'</small>';var a=new Audio('s/'+n[0]+'.mp3');b.onclick=function(){a.currentTime=0;a.play()};l.appendChild(b)})});
</script>
