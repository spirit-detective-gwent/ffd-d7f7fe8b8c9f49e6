<h1 style="margin:0 0 6px">End-of-game songs</h1><p>Tap to hear. Tap again to restart. Pick one for winning and one for losing.</p><div id=l></div>
<script>
var G=[["Win song",[
["v0","V0 · Current win song","Won! Orchestral winning jingle · spuispuin",1],
["v1","V1 · Huge brass hit, triumphant sting","Discovery Hit · Kevin MacLeod"],
["v2","V2 · Heroic orchestra, rising fanfare finish","Dark Star · Kevin MacLeod"],
["v3","V3 · Real orchestra, Beethoven victory finale","Egmont Overture Finale · Beethoven, mix by Kevin MacLeod"],
["v4","V4 · Epic drama, horns and drums climax","Achilles · Kevin MacLeod"],
["v5","V5 · Big, heavy horns and drums","Strength of the Titans · Kevin MacLeod"],
["v6","V6 · Cool groove: drums and low strings","Gustav Sting · Kevin MacLeod"],
["v7","V7 · Pounding war drums, no melody","Round Drums · Kevin MacLeod"],
["v8","V8 · Proud, triumphant after-the-battle finale","Long Road Ahead · Kevin MacLeod"]]],
["Lose song",[
["d0","D0 · Current lose song","Der Kleber Sting · Kevin MacLeod",1],
