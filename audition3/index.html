<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Game over sounds</title>
<style>body{background:#101522;color:#eee;font:16px system-ui;margin:0;padding:16px}button{display:block;width:100%;margin:8px 0;padding:16px;font-size:18px;border-radius:12px;border:0;background:#26304d;color:#fff;text-align:left}button small{color:#9ab;display:block;font-size:13px}h2{margin:18px 0 4px}.c{background:#4a2a2a}</style>
<h1 style="margin:0 0 6px">Game-over sounds</h1><p>Tap to hear. Pick one for winning and one for losing.</p><div id=l></div>
<script>
var G=[["Win sound",[["w0","W0 · Current win sound","What you hear now",1],["w1","W1 · Victory sting A","Real recorded victory sting"],["w2","W2 · Victory sting B","Longer, fuller"],["w3","W3 · Victory sting C","Shorter and punchier"],["w4","W4 · Big hit","Cinematic impact, no melody"],["w5","W5 · Blade clash","Metal clash ring"]]],
["Lose sound",[["l0","L0 · Current lose sound","What you hear now",1],["l1","L1 · Deep boom","Single low impact"],["l2","L2 · Shatter","Glass breaking"],["l3","L3 · Low rumble","Dark rumble fade"],["l4","L4 · Blade clash, long","Metal clash with a ring-out"],["l5","L5 · Heavy punch","Final knockout hit"],["l6","L6 · Pain grunt","Fighter hit hard, no music"]]]];
var l=document.getElementById('l');G.forEach(function(g){var h=document.createElement('h2');h.textContent=g[0];l.appendChild(h);g[1].forEach(function(n){var b=document.createElement('button');if(n[3])b.className='c';b.innerHTML=n[1]+'<small>'+n[2]+'</small>';var a=new Audio('s/'+n[0]+'.mp3');b.onclick=function(){a.currentTime=0;a.play()};l.appendChild(b)})});
</script>
